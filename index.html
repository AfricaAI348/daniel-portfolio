<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Daniel — Builder</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>

<style>
body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    background: #0c0c0c;
    color: white;
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: auto;
}

.hero {
    padding: 80px 0;
}

.hero-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
}

.hero h1 {
    font-size: 48px;
}

.highlight {
    color: orange;
}

.hero-visual {
    display: flex;
    justify-content: center;
}

.photo-daniel {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,0.1);
}

.avatar-photo {
    width: 100%;
    height: 100%;
}

/* Mobile */
@media(max-width:768px){
    .hero-grid{
        grid-template-columns:1fr;
        text-align:center;
    }
}
</style>
</head>

<body>

<section class="hero">
<div class="container hero-grid">

<!-- TEXT -->
<div>
    <h1>I build things <br> that <span class="highlight">work</span>.</h1>
    <p>No team. No funding. Just code.</p>
</div>

<!-- VISUAL -->
<div class="hero-visual">

<div class="photo-daniel">

<!-- 🔥 YOUR CODED IMAGE -->
<svg viewBox="0 0 400 500" class="avatar-photo" xmlns="http://www.w3.org/2000/svg">

    <!-- Wall -->
    <rect width="400" height="500" fill="#d6cbb8"/>

    <!-- Ground -->
    <rect y="350" width="400" height="150" fill="#b8a98c"/>

    <!-- Bike -->
    <circle cx="110" cy="380" r="35" fill="#111"/>
    <circle cx="290" cy="380" r="35" fill="#111"/>
    <rect x="140" y="310" width="120" height="20" fill="#444" rx="5"/>

    <!-- Body -->
    <!-- Legs -->
    <rect x="150" y="360" width="40" height="120" fill="#1e4ed8" rx="10"/>
    <rect x="210" y="360" width="40" height="120" fill="#1e4ed8" rx="10"/>

    <!-- Shirt -->
    <rect x="140" y="260" width="120" height="100" fill="#0f5132" rx="20"/>

    <!-- Logo -->
    <circle cx="200" cy="310" r="35" fill="#39ff14"/>
    <text x="200" y="318" font-size="28" fill="white" text-anchor="middle">LV</text>

    <!-- Arms -->
    <rect x="130" y="280" width="20" height="100" fill="#8d5524" rx="10"/>
    <rect x="250" y="280" width="20" height="100" fill="#8d5524" rx="10"/>

    <!-- Head -->
    <circle cx="200" cy="220" r="45" fill="#c68642"/>

    <!-- Hair -->
    <rect x="155" y="170" width="90" height="40" fill="#111" rx="20"/>

    <!-- Eyes -->
    <circle cx="185" cy="215" r="5" fill="#000"/>
    <circle cx="215" cy="215" r="5" fill="#000"/>

    <!-- Mouth -->
    <path d="M185 240 Q200 250 215 240" stroke="#000" stroke-width="2" fill="none"/>

</svg>

</div>
</div>

</div>
</section>

</body>
</html>
